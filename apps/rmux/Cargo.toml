[package]
name = "neta-rmux"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
crossterm = { workspace = true, features = ["event-stream"] }
base64.workspace = true
futures-util.workspace = true
libc.workspace = true
neta-client = { path = "../../crates/neta-client" }
neta-protocol = { path = "../../crates/neta-protocol" }
neta-terminal = { path = "../../crates/neta-terminal" }
ratatui = { workspace = true, features = ["crossterm"] }
ratatui-rmux.workspace = true
rmux-sdk.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
pretty_assertions = "=1.4.1"
