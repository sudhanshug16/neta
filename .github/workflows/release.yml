# A tag pushed by CI with GITHUB_TOKEN does not trigger this workflow (GitHub
# suppresses workflow runs triggered by GITHUB_TOKEN pushes), so after the
# publish job pushes v3.x.y, dispatch this workflow by hand:
#   gh workflow run release.yml -f tag=v3.x.y
name: release

on:
  push:
    tags: ['v3.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v3.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-15
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_26.app
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Resolve tag
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build app bundle
        run: |
          APP="$(bash apps/macos/scripts/build-app.sh)"
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Zip app bundle
        run: ditto -c -k --keepParent "$APP" "NetaDesktop-$TAG.zip"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes --title "Neta $TAG" || gh release view "$TAG" >/dev/null
      - name: Upload app zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "NetaDesktop-$TAG.zip" --clobber
