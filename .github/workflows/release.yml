# A tag pushed by CI with GITHUB_TOKEN does not trigger this workflow (GitHub
# suppresses workflow runs triggered by GITHUB_TOKEN pushes), so after the
# publish job pushes v3.x.y, dispatch this workflow by hand:
#   gh workflow run release.yml -f tag=v3.x.y
name: release

on:
  push:
    tags: ['v3.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v3.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Resolve tag
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes --title "Neta $TAG" || gh release view "$TAG" >/dev/null
