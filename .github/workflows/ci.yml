name: ci

# Every push to main and every pull request is checked. A push to main also
# publishes, but only when package.json names a version npm does not have yet,
# so ordinary pushes are a no-op and a re-run never double-publishes.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build
      - run: node dist/main.js --version
      - run: bun run setup:opencode
      - run: bun run smoke

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run setup:opencode
      - run: bun run build
      - run: bun run smoke

  opencode:
    name: opencode-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      NETA_RELEASE_BUILD: "1"
      NETA_REQUIRED_CONFORMANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install terminal fixture dependency
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux
          elif ! command -v tmux >/dev/null; then
            brew install tmux
          fi
      - run: bun install --frozen-lockfile
      - run: bun run setup:opencode
      - run: bun run build
      - run: bun run build:opencode
      - run: bun run test:conformance
      - run: tar -C dist/opencode -czf opencode-${{ matrix.platform }}.tar.gz ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ matrix.platform }}
          path: opencode-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [ts, macos, opencode]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag
      id-token: write # npm trusted publishing, and the provenance it generates
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+, newer than the runner ships.
      - run: npm install -g npm@latest

      - id: version
        name: Is this version already published?
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "Nothing to do: $name@$version is already on npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $name@$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - if: steps.version.outputs.publish == 'true'
        run: bun run build
      - if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: opencode-*
          path: ${{ runner.temp }}/neta-opencode
          merge-multiple: true
      - if: steps.version.outputs.publish == 'true'
        run: |
          mkdir -p dist/opencode
          for archive in "$RUNNER_TEMP"/neta-opencode/opencode-*.tar.gz; do
            tar -xzf "$archive" -C dist/opencode
          done
      - if: steps.version.outputs.publish == 'true'
        run: bun run verify:opencode

      # No token: npm trusts this workflow through OIDC, configured once in the
      # package's settings on npmjs.com. Nothing here expires or needs rotating,
      # and provenance is attached automatically.
      #
      # --ignore-scripts because the checks above are the release gate; running
      # prepublishOnly here would repeat them under a second toolchain.
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --ignore-scripts

      - if: steps.version.outputs.publish == 'true'
        name: Tag the release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
