[package]
name = "neta-client"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
neta-protocol = { path = "../neta-protocol" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
